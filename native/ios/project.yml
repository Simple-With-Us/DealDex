# iOS identity — do not mix these up:
#   Bundle ID: net.dealdex
#   Apple Developer bundle resource ID: R2FAW69NPD
#     (NOT a team ID. Never put R2FAW69NPD in DEVELOPMENT_TEAM or any team field.)
#   DEVELOPMENT_TEAM / Apple team ID: CC8UTF7ATG
# Apple App ID net.dealdex is registered.
#
# Project Format: Xcode 26.3-compatible (objectVersion / preferredProjectObjectVersion = 100).
# XcodeGen 2.46 still emits objectVersion 77 for xcodeVersion 26.3; after `xcodegen generate`
# `xcodegen-post.py` rewrites 77 → 100 and LastUpgradeCheck → 2630 so the File Inspector
# shows Xcode 26.3, not Xcode 16 / 14.
name: DealDex
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Release
  xcodeVersion: "26.3"
  postGenCommand: "python3 xcodegen-post.py"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    # RECORD OF WHAT SHIPPED, not the source of truth for what ships next.
    # Unified scheme (owner 2026-10-18): MARKETING_VERSION = 1.0.<commit_count>
    # and CURRENT_PROJECT_VERSION = <commit_count>, where <commit_count> is
    # `git rev-list --count HEAD`.  The two always describe the same number, so
    # App Store Connect renders "1.0.307 (307)".
    # The ship script passes both on the xcodebuild line; sync these after each ship.
    # UTC YYYYMMDDHHMM build stamps are retired and must not come back.
    # RECORD OF WHAT SHIPPED, not the source of truth for what ships next:
    # the ship script passes both values on the xcodebuild command line, and
    # reads this one as the build-number FLOOR, so it must stay below the
    # commit count of any commit that can ship.
    MARKETING_VERSION: "1.0.340"
    CURRENT_PROJECT_VERSION: "340"
    DEVELOPMENT_TEAM: CC8UTF7ATG
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    ENABLE_PREVIEWS: YES
    SWIFT_STRICT_CONCURRENCY: targeted
    INFOPLIST_KEY_CFBundleDisplayName: DealDex
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.shopping
    INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    # Native Sentry. Empty unless xcodebuild/CI passes SENTRY_DSN=...
    # SentryTelemetry.swift skips init when this expands to empty or $(SENTRY_DSN).
    # Do not put a live DSN in this file or in Info.plist.
    SENTRY_DSN: ""

packages:
  Sentry:
    url: https://github.com/getsentry/sentry-cocoa.git
    from: "9.31.0"

targets:
  DealDex:
    type: application
    platform: iOS
    bundleId: net.dealdex
    sources:
      - path: DealDex
        excludes:
          - Info.plist
    dependencies:
      - sdk: AuthenticationServices.framework
      - package: Sentry
        product: Sentry
    settings:
      base:
        INFOPLIST_FILE: DealDex/Info.plist
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: DealDex
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.shopping
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        PRODUCT_BUNDLE_IDENTIFIER: net.dealdex
        PRODUCT_NAME: DealDex
        PRODUCT_MODULE_NAME: DealDex
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "Apple Development"
        DEVELOPMENT_TEAM: CC8UTF7ATG
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: YES
        SDKROOT: iphoneos
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/Frameworks"
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: DealDex/Info.plist
      properties:
        CFBundleDisplayName: DealDex
        CFBundleName: DealDex
        CFBundleIdentifier: net.dealdex
        CFBundleDevelopmentRegion: en
        CFBundlePackageType: APPL
        CFBundleIconName: AppIcon
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        AppUpdateAppleId: 6804249232
        LSApplicationCategoryType: public.app-category.shopping
        ITSAppUsesNonExemptEncryption: false
        SENTRY_DSN: $(SENTRY_DSN)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "DealDex reads a card's name and number with the camera so it can price it.  The image stays on your iPhone — only the text you tap to search is ever sent."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        CFBundleURLTypes:
          - CFBundleURLName: net.dealdex
            CFBundleURLSchemes:
              - dealdex
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
schemes:
  DealDex:
    build:
      targets:
        DealDex: all
    run:
      config: Debug
    archive:
      config: Release
