name: iOS ship cron park

# FLEET-INFRA-CC: the real ios-ship workflow is disabled_manually (signing
# credential hold; last scheduled success 2026-09-27).  Sentry Crons still
# expects check-ins for ci-dealdex-ios-testflight-ship-github-hosted-macos.
# This ubuntu heartbeat upserts that same monitor until ios-ship is re-enabled.
# Disable this workflow when TestFlight ships resume.  Never archives or uploads.

on:
  schedule:
    - cron: '22 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ship-cron-park
  cancel-in-progress: false

jobs:
  heartbeat:
    if: github.event.repository.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Park check-in for the ios-ship Sentry Crons monitor
        env:
          SENTRY_FLEET_DSN: ${{ secrets.SENTRY_FLEET_DSN }}
        run: python3 scripts/sentry-ci-report.py --park-ios-ship
