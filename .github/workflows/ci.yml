name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: iOS signing key-file handoff
        run: |
          bash -n scripts/ios-stage-asc-key.sh
          bash -n scripts/test-ios-stage-asc-key.sh
          bash -n scripts/ios-appstore-gm-prepare.sh
          bash scripts/test-ios-stage-asc-key.sh
          python3 scripts/sentry-ci-report-margins_test.py
          SENTRY_FLEET_DSN= python3 scripts/sentry-ci-report.py --park-ios-ship

      - name: Install dependencies
        # `npm ci` is what vercel.json runs, so CI has to prove that exact
        # command works. The lockfile drifted out of sync on npm 10 (Node 22)
        # and CI papered over it with `npm install`, which meant green CI no
        # longer told us the production install would succeed.
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android
    env:
      CI: true
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            native/android/**/*.gradle*
            native/android/**/gradle-wrapper.properties

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ${ANDROID_SDK_ROOT}" >&2
            exit 1
          fi
          # pipefail + `yes` yields exit 141 when sdkmanager closes stdin; do not fail the job.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Assemble debug and unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      # Release path is where R8 mappings + source context upload.  DSN and
      # auth token stay in repo secrets; empty values leave the SDK dark and
      # skip the upload.  The APK is unsigned when signing env is absent.
      - name: Assemble release (Sentry mappings)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon
          rc=$?
          apk="$(find app/build/outputs/apk/release -name 'DealDex-release*.apk' 2>/dev/null | head -1)"
          if [ -n "$apk" ]; then
            if [ "$rc" -ne 0 ]; then
              echo "::warning::Release APK built ($apk); Sentry mapping upload failed.  Replace GitHub secret SENTRY_AUTH_TOKEN (401 invalid) with a project:releases token for org simple-with-us project dealdex."
            fi
            exit 0
          fi
          exit "$rc"
