name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: iOS signing key-file handoff
        run: |
          bash -n scripts/ios-stage-asc-key.sh
          bash -n scripts/test-ios-stage-asc-key.sh
          bash -n scripts/ios-appstore-gm-prepare.sh
          bash scripts/test-ios-stage-asc-key.sh
          bash scripts/ios-fleet/test-asc-credentials.sh
          node --test scripts/ios-fleet/test-asc-key.test.mjs
          node --test scripts/ios-fleet/test-asc-credentials.mjs
          python3 scripts/sentry-ci-report-margins_test.py
          SENTRY_FLEET_DSN= python3 scripts/sentry-ci-report.py --park-ios-ship

      - name: Install dependencies
        # `npm ci` is what vercel.json runs, so CI has to prove that exact
        # command works. The lockfile drifted out of sync on npm 10 (Node 22)
        # and CI papered over it with `npm install`, which meant green CI no
        # longer told us the production install would succeed.
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  # iOS compile check.  A push to main (and a manual run) always builds, so main
  # carries an iOS result on every commit.  A pull request only takes a macOS
  # slot when native/ios/ or the build workflow itself changed.  Fork PRs are
  # rejected inside ios-build.yml.
  ios-changes:
    # Fork PRs get neither the gate nor a macOS slot.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      native: ${{ steps.gate.outputs.native }}
    steps:
      - name: Decide whether the iOS build is needed
        id: gate
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Not a pull_request event (${EVENT}); iOS build runs."
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The compare API names every changed file without a checkout.  Fail
          # closed: if the list cannot be read, build.
          if ! files="$(gh api --paginate "repos/${REPO}/compare/${BASE_SHA}...${HEAD_SHA}" --jq '.files[].filename' 2>/dev/null)" || [ -z "$files" ]; then
            echo "Could not list changed files; iOS build runs (fail closed)."
            echo "native=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if printf '%s\n' "$files" | grep -qE '^(native/ios/|\.github/workflows/ios-build\.yml$)'; then
            echo "iOS paths changed; iOS build runs."
            echo "native=true" >> "$GITHUB_OUTPUT"
          else
            echo "No iOS paths changed; iOS build skipped (no macOS slot)."
            echo "native=false" >> "$GITHUB_OUTPUT"
          fi

  ios:
    needs: ios-changes
    if: needs.ios-changes.outputs.native == 'true'
    uses: ./.github/workflows/ios-build.yml

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android
    env:
      CI: true
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            native/android/**/*.gradle*
            native/android/**/gradle-wrapper.properties

      - name: Install SDK packages
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "${ANDROID_SDK_ROOT}/cmdline-tools" -name sdkmanager -type f | sort -V | tail -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under ${ANDROID_SDK_ROOT}" >&2
            exit 1
          fi
          # pipefail + `yes` yields exit 141 when sdkmanager closes stdin; do not fail the job.
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-37.0" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Assemble debug and unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon

      # Release path is where R8 mappings + source context upload.  DSN and
      # auth token stay in repo secrets; empty values leave the SDK dark and
      # skip the upload.  The APK is unsigned when signing env is absent.
      - name: Assemble release (Sentry mappings)
        env:
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set +e
          ./gradlew :app:assembleRelease --no-daemon
          rc=$?
          apk="$(find app/build/outputs/apk/release -name 'DealDex-release*.apk' 2>/dev/null | head -1)"
          if [ -n "$apk" ]; then
            if [ "$rc" -ne 0 ]; then
              echo "::warning::Release APK built ($apk); Sentry mapping upload failed.  Replace GitHub secret SENTRY_AUTH_TOKEN (401 invalid) with a project:releases token for org simple-with-us project dealdex."
            fi
            exit 0
          fi
          exit "$rc"
