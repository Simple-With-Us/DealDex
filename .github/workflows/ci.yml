name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: iOS signing key-file handoff
        run: |
          bash -n scripts/ios-stage-asc-key.sh
          bash -n scripts/test-ios-stage-asc-key.sh
          bash -n scripts/ios-appstore-gm-prepare.sh
          bash scripts/test-ios-stage-asc-key.sh

      - name: Install dependencies
        # `npm ci` is what vercel.json runs, so CI has to prove that exact
        # command works. The lockfile drifted out of sync on npm 10 (Node 22)
        # and CI papered over it with `npm install`, which meant green CI no
        # longer told us the production install would succeed.
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
