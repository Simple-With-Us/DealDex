name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: iOS signing key-file handoff
        run: |
          bash -n scripts/ios-stage-asc-key.sh
          bash -n scripts/test-ios-stage-asc-key.sh
          bash -n scripts/ios-appstore-gm-prepare.sh
          bash scripts/test-ios-stage-asc-key.sh

      - name: Install dependencies
        # `npm ci` is what vercel.json runs, so CI has to prove that exact
        # command works. The lockfile drifted out of sync on npm 10 (Node 22)
        # and CI papered over it with `npm install`, which meant green CI no
        # longer told us the production install would succeed.
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: native/android
    env:
      CI: true
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: native/android

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;35.0.0" "build-tools;36.0.0"

      - name: Assemble debug and unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --no-daemon
